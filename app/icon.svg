<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="金元宝">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset=".45" stop-color="#FFC62E"/>
      <stop offset="1" stop-color="#C8870A"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D2"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
  </defs>

  <!-- 元宝主体：底窄顶宽，两端上翘，顶面中间凹成鞍形 -->
  <path d="M15 49 Q32 55 49 49 L61 28 Q32 36 3 28 Z"
        fill="url(#body)" stroke="#7A5200" stroke-width="3" stroke-linejoin="round"/>

  <!-- 顶面亮部，和腹部拉开层次 -->
  <path d="M61 28 Q32 36 3 28 Q32 33 61 28 Z" fill="#FFF0BA" opacity=".55"/>

  <!-- 中间凸起 -->
  <path d="M24 34 H40 L37 23 H27 Z"
        fill="url(#knob)" stroke="#7A5200" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="32" cy="23" rx="5.6" ry="2.6"
           fill="#FFF6D2" stroke="#7A5200" stroke-width="3"/>

  <!-- 腹部高光 -->
  <path d="M20 46 Q24 38 31 36" fill="none" stroke="#FFF3C6" stroke-width="3"
        stroke-linecap="round" opacity=".65"/>
</svg>
