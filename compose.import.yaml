services:
  import-probe:
    image: personal-cfo:0.4.3
    command: ["node", "scripts/import-probe.mjs"]
    environment:
      PGHOST: postgres
      PROBE_PGHOST: cfo-test-postgres-1
    volumes:
      - credentials:/run/cfo:ro
      - originals:/data
      - probe_originals:/probe-originals:ro
      - probe_credentials:/run/probe-secrets:ro
    networks: [default, probe]
    depends_on:
      app: {condition: service_healthy}
networks:
  probe:
    external: true
    name: cfo-test_default
volumes:
  probe_originals:
    external: true
    name: cfo-test_originals
  probe_credentials:
    external: true
    name: cfo-test_credentials
