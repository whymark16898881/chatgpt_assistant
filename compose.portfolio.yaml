# Source must already be a verified, restricted read-only NAS mount.
# Does not create or modify Samba shares, source services or broker gateways.
services:
  portfolio-sync:
    image: personal-cfo:0.4.24
    command: ["node", "scripts/sync-investment-source.mjs", "--loop"]
    environment:
      PGHOST: postgres
      CFO_PORTFOLIO_REFRESH_POLICY: twice_daily
      CFO_PORTFOLIO_DIR: /portfolio-source
    volumes:
      - credentials:/run/cfo:ro
      - originals:/data
      - type: bind
        source: ${CFO_PORTFOLIO_DIR:?Set an existing read-only NAS mount directory}
        target: /portfolio-source
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
