# Existing plugin migration stops the old client before reusing its tunnel ID.
services:
  tunnel:
    image: ghcr.io/openai/tunnel-client:v0.0.21@sha256:983df88cd56d49ae3863ae52b751d106c95aba8a03783c87ac2304b4e0cd154a
    restart: unless-stopped
    command:
      - --control-plane.api-key=file:/run/secrets/openai_runtime_key
      - "--mcp.extra-headers=Authorization: file:/run/cfo/mcp-authorization"
      - "--mcp.discovery-extra-headers=Authorization: file:/run/cfo/mcp-authorization"
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${CFO_TUNNEL_ID:?Set the CFO tunnel ID}
      MCP_SERVER_URL: http://app:3000/mcp
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
      LOG_LEVEL: info
      LOG_FORMAT: json
    volumes:
      - credentials:/run/cfo:ro
    secrets: [openai_runtime_key]
    depends_on:
      app: {condition: service_healthy}
    mem_limit: 256m
secrets:
  openai_runtime_key:
    file: ./secrets/openai-runtime-key.txt
